
name: Build Aseprite (yay)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Refresh keyring and update
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git sudo

      - name: Skip debug package (smaller, faster)
        run: |
          sed -i 's/^OPTIONS=.*/OPTIONS=(strip !debug)/' /etc/makepkg.conf

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder /home/builder

      - name: Bootstrap yay
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/yay-bin.git
            cd yay-bin
            makepkg -si --noconfirm
          '

      - name: Snapshot yay cache
        run: |
          find /home/builder/.cache/yay -name "*.pkg.tar.zst" \
            > /tmp/before.txt 2>/dev/null || true

      - name: Build Aseprite with yay
        run: |
          su builder -c '
            yay -S --noconfirm --removemake aseprite
          '

      - name: Collect package
        run: |
          mkdir -p artifact
          find /home/builder/.cache/yay -name "*.pkg.tar.zst" \
            > /tmp/after.txt

          comm -13 /tmp/before.txt /tmp/after.txt |
            while read -r pkg; do
              cp "$pkg" artifact/
            done

          if [ -z "$(ls -A artifact)" ]; then
            echo "No new package found in yay cache."
            exit 1
          fi

          ls -lh artifact

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-archlinux-${{ github.run_id }}
          path: artifact/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

name: Build helix-steel-git

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Update Arch and install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            git \
            sudo \
            rustup

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Download AUR package
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/helix-steel-git.git
          '

      - name: Build package
        run: |
          su builder -c '
            cd /home/builder/helix-steel-git
            makepkg -s --noconfirm
          '

      - name: Copy package
        run: |
          mkdir -p /github/workspace/packages
          cp /home/builder/helix-steel-git/*.pkg.tar.zst \
             /github/workspace/packages/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: helix-steel-git
          path: packages/*.pkg.tar.zst

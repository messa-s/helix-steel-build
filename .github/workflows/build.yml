name: Build helix-steel-git (yay)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Refresh keyring and update
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel git sudo rust

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder /home/builder

      - name: Bootstrap yay
        run: |
          su builder -c '
            cd /home/builder
            git clone https://aur.archlinux.org/yay-bin.git
            cd yay-bin
            makepkg -si --noconfirm
          '

      - name: Build helix-steel-git with yay
        run: |
          su builder -c '
            cd /home/builder
            yay -S --noconfirm --removemake helix-steel-git
          '

      - name: Copy package
        run: |
          mkdir -p /github/workspace/packages
          find /home/builder -maxdepth 3 -name "helix-steel-git*.pkg.tar.zst" \
            -exec cp {} /github/workspace/packages/ \;

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: helix-steel-git
          path: packages/*.pkg.tar.zst

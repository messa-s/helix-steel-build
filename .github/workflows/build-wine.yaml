name: Build Wine d2d1 (Arch Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: archlinux:latest

    steps:
      - name: Initialize keyring and update system
        run: |
          # If pacman fails with "restricting filesystem access failed"
          # (Landlock), add --disable-sandbox to the pacman commands below.
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm

      - name: Install build dependencies
        run: |
          pacman -S --needed --noconfirm \
            base-devel \
            linux-api-headers \
            git \
            mingw-w64-gcc \
            python \
            perl \
            perl-xml-parser \
            fontconfig \
            freetype2 \
            gnutls \
            libunwind \
            libx11 \
            libxcomposite \
            libxcursor \
            libxfixes \
            libxi \
            libxrandr \
            libxrender \
            libxext \
            libxinerama \
            libxkbcommon \
            xkeyboard-config \
            systemd-libs \
            wayland \
            wayland-protocols \
            libglvnd \
            mesa \
            alsa-lib \
            libpulse \
            dbus \
            gstreamer \
            gst-plugins-base-libs \
            sdl2 \
            vulkan-headers \
            vulkan-icd-loader \
            zstd

      - name: Clone Wine d2d1 fork
        run: |
          git clone \
            --branch d2d1-dcomp-11.0 \
            --depth 1 \
            https://github.com/giang17/wine.git \
            wine

      - name: Show source revision
        working-directory: wine
        run: git log -1 --oneline

      - name: Configure Wine
        working-directory: wine
        run: |
          test -f /usr/include/linux/ntsync.h || echo "WARNING: ntsync.h missing, ntsync support will be disabled"
          ./configure \
            --prefix=/opt/wine-d2d1 \
            --enable-archs=i386,x86_64
          grep HAVE_LINUX_NTSYNC_H include/config.h || echo "WARNING: ntsync not detected"

      - name: Build Wine
        working-directory: wine
        run: make -j$(nproc)

      - name: Install Wine
        working-directory: wine
        run: make install

      - name: Verify installation
        run: |
          test -x /opt/wine-d2d1/bin/wine
          test -f /opt/wine-d2d1/share/wine/wine.inf
          test -d /opt/wine-d2d1/lib/wine/i386-windows
          test -d /opt/wine-d2d1/lib/wine/x86_64-windows

          /opt/wine-d2d1/bin/wine --version

          echo "Wine installation verified."
          du -sh /opt/wine-d2d1

      - name: Package Wine installation
        run: |
          mkdir -p artifact
          tar --zstd -cf artifact/wine-d2d1-x86_64.tar.zst -C /opt wine-d2d1
          ls -lh artifact/

      - name: Upload Wine build
        uses: actions/upload-artifact@v4
        with:
          name: wine-d2d1-11.0-archlinux
          path: artifact/wine-d2d1-x86_64.tar.zst
          if-no-files-found: error
          retention-days: 14
